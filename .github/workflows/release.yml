name: Release NovaPlayer

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Package DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NovaPlayer in Release mode
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Package Distributable DMG
        run: |
          chmod +x scripts/package_dmg.sh
          ./scripts/package_dmg.sh

      - name: Create ZIP archive
        run: |
          cd build
          zip -r -y NovaPlayer.zip NovaPlayer.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NovaPlayer.dmg
            build/NovaPlayer.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
