[package]
name = "nova-player"
version = "1.0.0"
description = "NovaPlayer - Minimalist, high-precision cross-platform video player"
authors = ["Nicola Beccaceci"]
edition = "2024"

[lib]
name = "nova_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
